<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fuyohaku</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#E6E7E2">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,opsz,wght@0,12..120,500&family=Shippori+Mincho:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #e6e7e2;
      --ink: #1c1917;
      --pencil: #3a5684;
      color-scheme: light;
    }

    * { box-sizing: border-box; }

    html {
      background: var(--paper);
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100svh;
      background: var(--paper);
      color: var(--ink);
      font-family: "EB Garamond", "Iowan Old Style", Palatino, "Palatino Linotype", serif;
      font-weight: 500;
      font-optical-sizing: auto;
    }

    main {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 2.5rem clamp(1.25rem, 9vw, 8.5rem);
    }

    .ja {
      margin: 0;
      font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
      font-size: clamp(1.35rem, 2.2vw, 1.8rem);
      letter-spacing: 0.04em;
    }

    h1 {
      margin: 0.8rem 0 0;
      font-size: clamp(2.4rem, 6vw, 4.25rem);
      font-weight: 500;
      line-height: 1;
      letter-spacing: -0.03em;
    }

    a {
      display: inline-block;
      margin-top: 1.25rem;
      color: var(--ink);
      font-size: 1.25rem;
      text-underline-offset: 0.18em;
      text-decoration-color: var(--pencil);
    }

    a:focus-visible {
      outline: 2px solid var(--pencil);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <p class="ja" lang="ja">余白</p>
    <h1>This page isn’t here.</h1>
    <a href="/">fuyohaku</a>
  </main>
</body>
</html>
