<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fuyohaku — project admin</title>
  <style>
    :root { color-scheme: light; --paper: #f7f7f3; --ink: #17202a; --muted: #75808b; --rule: #dfe5e5; --blue: #27415a; }
    * { box-sizing: border-box; } body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; }
    main { width: min(100% - 2rem, 54rem); margin: 0 auto; padding: 3rem 0 5rem; }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: 2.5rem; }
    h1, h2 { margin: 0; font-weight: 400; letter-spacing: .08em; } h1 { font-size: 1.2rem; } h2 { color: var(--blue); font-size: 1.8rem; }
    .muted { color: var(--muted); font-size: .8rem; } a { color: var(--blue); }
    form, .project { padding: 1rem; border: 1px solid var(--rule); border-radius: .4rem; margin-top: 1rem; background: rgba(255,255,255,.2); }
    label { display: grid; gap: .35rem; color: var(--muted); font-size: .75rem; letter-spacing: .08em; margin-top: .8rem; }
    input, textarea { width: 100%; border: 1px solid var(--rule); border-radius: .25rem; padding: .7rem; background: var(--paper); color: var(--ink); font: inherit; }
    textarea { min-height: 5rem; resize: vertical; } button { border: 0; border-radius: .25rem; padding: .65rem .9rem; background: var(--blue); color: white; cursor: pointer; } button.danger { background: transparent; color: #9a3d3d; border: 1px solid #e4caca; } .actions { display: flex; gap: .6rem; margin-top: 1rem; }
    .dropzone { display: grid; place-items: center; min-height: 7rem; margin-top: .8rem; padding: 1rem; border: 1px dashed #b9c7cc; border-radius: .35rem; color: var(--muted); text-align: center; cursor: pointer; } .dropzone.dragging, .dropzone:hover { border-color: var(--blue); background: rgba(255,255,255,.5); } .dropzone input { display: none; } .upload-status { margin: .5rem 0 0; color: var(--muted); font-size: .78rem; }
    .project { display: grid; grid-template-columns: 8rem 1fr auto; gap: 1rem; align-items: center; } .project img { width: 8rem; height: 5rem; object-fit: cover; border-radius: .25rem; background: #d4dfe3; } .project h3 { margin: 0; color: var(--blue); font-weight: 500; } .project p { margin: .2rem 0 0; color: var(--muted); font-size: .85rem; }
    @media (max-width: 600px) { .project { grid-template-columns: 5rem 1fr; } .project img { width: 5rem; height: 4rem; } .project .actions { grid-column: 1 / -1; } header { align-items: start; flex-direction: column; } }
  </style>
</head>
<body><main>
  <header><h1>fuyohaku / projects</h1><a href="/">View site</a></header>
  <section id="dashboard"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:1rem"><div><h2>Projects</h2><p class="muted">Protected by Cloudflare Access.</p></div><a href="/">View site</a></div><form id="project-form"><input id="project-id" type="hidden"><label>Title<input id="title" required></label><label>Description<textarea id="description" required></textarea></label><label>Labels<input id="labels" type="text" placeholder="web, tools, experiments"></label><label>Image URL or path<input id="image" type="text" placeholder="https://… or /media/…"></label><label class="dropzone" id="dropzone">Or drop an image here, or click to choose a file<input id="image-file" type="file" accept="image/*"></label><p class="upload-status" id="upload-status">Use a URL or upload an image. Uploaded files are stored in R2.</p><label>Project URL<input id="url" type="text" value="#projects" required></label><label>Order<input id="sort-order" type="number" value="0"></label><div class="actions"><button>Save project</button><button type="button" id="cancel" class="danger" hidden>Cancel edit</button></div></form><div id="projects-list"></div></section>
</main><script>
const $ = (id) => document.getElementById(id);
async function request(path, options = {}) { const response = await fetch(path, { ...options, headers: { ...(options.body instanceof FormData ? {} : options.body ? {'content-type':'application/json'} : {}), ...(options.headers || {}) } }); const data = await response.json(); if (!response.ok) throw new Error(data.error || 'Request failed'); return data; }
function render(projects) { $('projects-list').innerHTML = projects.map((project) => `<article class="project"><img src="${project.image}" alt=""><div><h3>${project.title}</h3><p>${(project.labels || []).join(' · ')}</p><p>${project.description}</p></div><div class="actions"><button data-edit="${project.id}">Edit</button><button class="danger" data-delete="${project.id}">Delete</button></div></article>`).join(''); document.querySelectorAll('[data-edit]').forEach((button) => button.onclick = () => edit(projects.find((p) => p.id === button.dataset.edit))); document.querySelectorAll('[data-delete]').forEach((button) => button.onclick = () => remove(button.dataset.delete)); }
function edit(project) { $('project-id').value = project.id; $('title').value = project.title; $('description').value = project.description; $('labels').value = (project.labels || []).join(', '); $('image').value = project.image; $('url').value = project.url; $('sort-order').value = project.sort_order; $('cancel').hidden = false; window.scrollTo({ top: 0, behavior: 'smooth' }); }
async function load() { const projects = await request('/api/projects'); render(projects); }
async function remove(id) { if (!confirm('Delete this project?')) return; await request(`/api/admin/projects/${id}`, { method: 'DELETE' }); await load(); }
$('cancel').onclick = () => { $('project-form').reset(); $('project-id').value = ''; $('cancel').hidden = true; };
const dropzone = $('dropzone'); const imageFile = $('image-file');
['dragenter', 'dragover'].forEach((eventName) => dropzone.addEventListener(eventName, (event) => { event.preventDefault(); dropzone.classList.add('dragging'); }));
['dragleave', 'drop'].forEach((eventName) => dropzone.addEventListener(eventName, (event) => { event.preventDefault(); dropzone.classList.remove('dragging'); }));
dropzone.addEventListener('drop', (event) => { imageFile.files = event.dataTransfer.files; $('upload-status').textContent = imageFile.files[0]?.name || 'No file selected'; });
imageFile.onchange = () => { $('upload-status').textContent = imageFile.files[0]?.name || 'No file selected'; };
$('project-form').onsubmit = async (event) => { event.preventDefault(); const id = $('project-id').value; try { let image = $('image').value.trim(); if (imageFile.files[0]) { $('upload-status').textContent = 'Uploading image…'; const form = new FormData(); form.append('file', imageFile.files[0]); image = (await request('/api/admin/uploads', { method: 'POST', body: form })).url; } if (!image) throw new Error('Add an image URL or upload an image.'); const payload = { title: $('title').value, description: $('description').value, labels: $('labels').value, image, url: $('url').value, sort_order: Number($('sort-order').value) || 0 }; await request(id ? `/api/admin/projects/${id}` : '/api/admin/projects', { method: id ? 'PATCH' : 'POST', body: JSON.stringify(payload) }); $('project-form').reset(); $('project-id').value = ''; $('cancel').hidden = true; $('upload-status').textContent = 'Use a URL or upload an image. Uploaded files are stored in R2.'; await load(); } catch (error) { alert(error.message); } };
load().catch((error) => alert(`Cloudflare Access is required: ${error.message}`));
</script></body></html>
